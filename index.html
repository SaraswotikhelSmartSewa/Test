<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>सरस्वतीखेल स्मार्ट सेवा</title>
  <style>
    /* RESTORING ORIGINAL BEAUTIFUL CSS */
    :root {
      --cream: #fdf6ec; --bark: #3b2a1a; --leaf: #2e7d45; --wa: #25D366;
      --font-head: 'Playfair Display', serif; --font-body: 'DM Sans', sans-serif;
    }
    body { background: var(--cream); color: var(--bark); font-family: var(--font-body); margin: 0; padding: 0; }
    
    /* Desktop Improvements */
    .header-logo-img { height: 120px; width: auto; margin-bottom: 1rem; transition: 0.3s; }
    .nav-bar { display: flex; justify-content: center; gap: 2rem; padding: 1rem; background: rgba(59, 42, 26, 0.05); }
    .nav-bar a { text-decoration: none; color: var(--bark); font-weight: 600; font-size: 0.9rem; }
    
    .header-action-row { display: flex; justify-content: center; gap: 1rem; margin-top: 2rem; align-items: stretch; }
    .date-card, .wa-header-btn { width: 220px; border-radius: 16px; padding: 1rem; box-sizing: border-box; }
    .wa-header-btn { background: var(--wa); color: white; text-decoration: none; display: flex; align-items: center; justify-content: center; font-weight: bold; }

    /* Mobile 3-Across Grid */
    .quick-links { display: grid; gap: 10px; padding: 1.5rem; }
    @media (max-width: 768px) {
      .quick-links { grid-template-columns: repeat(3, 1fr); }
      .lbtn { flex-direction: column; padding: 12px 5px; font-size: 0.75rem; text-align: center; border-radius: 12px; }
      .lbtn span { font-size: 1.2rem; margin-bottom: 5px; }
      .nav-bar { display: none; } /* Hide nav on mobile for clean look */
    }

    /* Multi-Price Styling */
    .product-card { background: white; border-radius: 20px; padding: 15px; box-shadow: 0 10px 20px rgba(59,42,26,0.05); }
    .price-table { margin-top: 10px; border-top: 1px solid #f0f0f0; padding-top: 8px; }
    .price-row { display: flex; justify-content: space-between; font-size: 0.85rem; padding: 4px 0; }
    .price-row b { color: var(--leaf); font-family: monospace; }
    
    /* Gap Correction for Ticker */
    .ticker-section { margin-top: 2.5rem; padding: 1rem 0; }
  </style>
</head>
<body>
  <nav class="nav-bar" id="topNav"></nav>

  <header style="text-align: center; padding: 3rem 1rem;">
    <div id="logoArea"></div>
    <h1 style="font-family: var(--font-head); font-size: 2.5rem; margin: 0.5rem 0;" id="shopTitle"></h1>
    <div id="headerStats" style="display: flex; justify-content: center; gap: 2rem; margin: 1.5rem 0;"></div>
    
    <div class="header-action-row">
       <div class="date-card" style="background: white; border: 1px solid #eee;">
         <small>Today</small><br><b id="liveDate"></b>
       </div>
       <a href="#" class="wa-header-btn" id="waLink">Order on WhatsApp</a>
    </div>
  </header>

  <div class="quick-links" id="linksGrid"></div>

  <div class="ticker-section" id="tickerRoot"></div>

  <main id="fresh" style="padding: 2rem;">
    <div id="productGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px;"></div>
  </main>

  <script>
    async function loadSite() {
      const res = await fetch('site-config.json?v=' + Date.now());
      const d = await res.json();

      document.getElementById('topNav').innerHTML = d.navTopics.map(t => `<a href="${t.url}">${t.label}</a>`).join('');
      document.getElementById('logoArea').innerHTML = `<img src="${d.meta.logoUrl}" class="header-logo-img">`;
      document.getElementById('shopTitle').textContent = d.meta.shopName;
      document.getElementById('liveDate').textContent = new Date().toLocaleDateString();
      
      document.getElementById('headerStats').innerHTML = d.stats.map(s => `
        <div><span style="font-size: 1.2rem; font-weight: bold;">${s.number}</span><br><small>${s.label}</small></div>
      `).join('');

      document.getElementById('linksGrid').innerHTML = d.links.map(l => `
        <a href="${l.url}" class="lbtn" style="background:${l.bgColor}; color:${l.textColor}; text-decoration:none; display:flex; align-items:center; justify-content:center;">
          <span>${l.icon}</span> ${l.label}
        </a>
      `).join('');

      let prodHtml = '';
      d.categories.forEach(cat => {
        cat.items.forEach(item => {
          const prices = item.options.map(o => `
            <div class="price-row"><span>${o.unit}</span><b>Rs.${o.price}</b></div>
          `).join('');
          prodHtml += `
            <div class="product-card">
              <img src="${item.imageUrl}" style="width:100%; border-radius:12px;">
              <h4 style="margin:10px 0 5px 0;">${item.name}</h4>
              <div class="price-table">${prices}</div>
            </div>`;
        });
      });
      document.getElementById('productGrid').innerHTML = prodHtml;
    }
    loadSite();
  </script>
</body>
</html>
