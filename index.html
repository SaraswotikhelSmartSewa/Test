<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>सरस्वतीखेल स्मार्ट सेवा</title>
  <style>
    /* ORIGINAL STYLING PRESERVED */
    :root {
      --cream: #fdf6ec; --bark: #3b2a1a; --leaf: #2e7d45; --wa: #25D366;
      --font-head: 'Playfair Display', serif; --font-body: 'DM Sans', sans-serif;
    }
    body { background: var(--cream); color: var(--bark); font-family: var(--font-body); margin: 0; padding: 0; }
    
    /* 1. Desktop Improvements (Logo & Symmetry) */
    .header-logo-img { height: 110px; width: auto; margin-bottom: 1rem; }
    .top-nav { display: flex; justify-content: center; gap: 2rem; padding: 1.2rem; background: rgba(59, 42, 26, 0.03); }
    .top-nav a { text-decoration: none; color: var(--bark); font-weight: 600; font-size: 0.9rem; }

    .header-action-row { display: flex; justify-content: center; gap: 1rem; margin-top: 1.5rem; align-items: stretch; }
    .date-card, .wa-header-btn { width: 220px; border-radius: 16px; padding: 1rem; box-sizing: border-box; }
    .wa-header-btn { background: var(--wa); color: white; text-decoration: none; display: flex; align-items: center; justify-content: center; font-weight: bold; }

    /* 2. Mobile Rule (3-Across Grid) & Gap Correction */
    .quick-links-grid { display: grid; gap: 10px; padding: 1.5rem; }
    @media (max-width: 768px) {
      .quick-links-grid { grid-template-columns: repeat(3, 1fr); }
      .lbtn { flex-direction: column; padding: 10px 5px; font-size: 0.75rem; text-align: center; border-radius: 12px; }
      .top-nav { display: none; }
    }
    .ticker-container { margin-top: 2.5rem; } /* Added gap for ticker */

    /* 3. Multi-Price Layout */
    .product-card { background: white; border-radius: 20px; padding: 15px; box-shadow: 0 10px 20px rgba(59,42,26,0.05); }
    .price-list { margin-top: 10px; border-top: 1px solid #f0f0f0; padding-top: 8px; }
    .price-item { display: flex; justify-content: space-between; font-size: 0.85rem; padding: 3px 0; }
    .price-item b { color: var(--leaf); font-family: monospace; }
  </style>
</head>
<body>
  <nav class="top-nav" id="navContainer"></nav>

  <header style="text-align: center; padding: 3rem 1rem;">
    <div id="logoContainer"></div>
    <h1 id="shopTitle" style="font-family: var(--font-head); font-size: 2.5rem;"></h1>
    <div id="statsRow" style="display: flex; justify-content: center; gap: 2rem; margin: 1rem 0;"></div>
    
    <div class="header-action-row">
       <div class="date-card" style="background: white; border: 1px solid #eee;">
         <small>Today</small><br><b id="currentDate"></b>
       </div>
       <a href="#" class="wa-header-btn" id="headerWa">Order on WhatsApp</a>
    </div>
  </header>

  <div class="quick-links-grid" id="linksContainer"></div>

  <div class="ticker-container" id="tickerSection"></div>

  <main id="fresh" style="padding: 2rem;">
    <div id="itemGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px;"></div>
  </main>

  <script>
    async function init() {
      const res = await fetch('site-config.json?v=' + Date.now());
      const cfg = await res.json();

      // Nav Topics
      document.getElementById('navContainer').innerHTML = cfg.navTopics.map(t => `<a href="${t.url}">${t.label}</a>`).join('');
      
      // Header Info
      document.getElementById('logoContainer').innerHTML = `<img src="${cfg.meta.logoUrl}" class="header-logo-img">`;
      document.getElementById('shopTitle').textContent = cfg.meta.shopName;
      document.getElementById('currentDate').textContent = new Date().toLocaleDateString();
      document.getElementById('statsRow').innerHTML = cfg.stats.map(s => `<div><b>${s.number}</b><br><small>${s.label}</small></div>`).join('');

      // Custom Buttons
      document.getElementById('linksContainer').innerHTML = cfg.links.map(l => `
        <a href="${l.url}" class="lbtn" style="background:${l.bgColor}; color:${l.textColor}; text-decoration:none; display:flex; align-items:center; justify-content:center;">
          <span>${l.icon}</span> ${l.label}
        </a>`).join('');

      // Multi-Price Items
      let html = '';
      cfg.categories.forEach(cat => {
        cat.items.forEach(item => {
          const priceRows = item.prices.map(p => `<div class="price-item"><span>${p.unit}</span><b>Rs. ${p.amount}</b></div>`).join('');
          html += `<div class="product-card">
            <img src="${item.imageUrl}" style="width:100%; border-radius:12px;">
            <h4>${item.name}</h4>
            <div class="price-list">${priceRows}</div>
          </div>`;
        });
      });
      document.getElementById('itemGrid').innerHTML = html;
    }
    init();
  </script>
</body>
</html>
